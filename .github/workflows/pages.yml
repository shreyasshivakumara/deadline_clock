name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Record latest successful source scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checked_at=$(gh api --method GET \
            "repos/${{ github.repository }}/actions/workflows/weekly-source-check.yml/runs" \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].run_started_at')
          if [ -n "$checked_at" ]; then
            printf '{\n  "lastSuccessfulScan": "%s"\n}\n' "$checked_at" > source-status.json
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
