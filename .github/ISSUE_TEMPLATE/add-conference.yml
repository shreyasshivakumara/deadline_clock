name: Add a conference
description: Request a conference for inclusion in Deadline Clock
title: "Add conference: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a venue for the next Deadline Clock update.

        Please link to the official conference website and, when available, the
        exact call-for-papers or important-dates page. Direct source links make
        verification faster and prevent incorrect deadlines from being published.
        Aggregator pages may be included as context, but they do not replace an
        official source.

  - type: input
    id: acronym
    attributes:
      label: Conference acronym
      placeholder: "Example: SIGGRAPH"
    validations:
      required: true

  - type: input
    id: full-name
    attributes:
      label: Full conference name
      placeholder: "Example: ACM SIGGRAPH Conference"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Primary category
      options:
        - Computer Graphics
        - Vision
        - XR + HCI
        - Visualization
    validations:
      required: true

  - type: input
    id: official-url
    attributes:
      label: Official conference page
      description: Link to the conference, organizer, or society website. Do not use an aggregator as the primary source.
      placeholder: "https://conference.example.org/2027/"
    validations:
      required: true

  - type: input
    id: cfp-url
    attributes:
      label: Official call-for-papers or dates page
      description: A direct link to the exact page containing submission dates makes verification much faster.
      placeholder: "https://conference.example.org/2027/call-for-papers"
    validations:
      required: false

  - type: input
    id: deadline
    attributes:
      label: Published deadline
      description: Include the date, exact time, and timezone when available.
      placeholder: "November 16, 2026, 23:59 AoE"
    validations:
      required: false

  - type: input
    id: event
    attributes:
      label: Event dates and location
      placeholder: "June 20-24, 2027 — Seattle, USA"
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Explain why the venue belongs in this tracker or note any uncertainty.
    validations:
      required: false
